# Один файл на всю разработку. В EDMS их было шесть
# (docker-compose.new / .previous / .prod / .onlyoffice / .seed / .override),
# и какой из них актуален, приходилось выяснять по датам изменения.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signflow}
      POSTGRES_DB: ${POSTGRES_DB:-signflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Миграции не должны стартовать до готовности базы: иначе первый
      # запуск падает на отказе подключения.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signflow} -d ${POSTGRES_DB:-signflow}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      # Внутри сети compose база доступна по имени сервиса, а не по localhost.
      POSTGRES_HOSTNAME: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Публикуемый порт настраивается: 8000 бывает занят другим проектом,
      # а на Windows его может держать резервирование winnat, при котором
      # порт выглядит свободным в netstat, но Docker его не отдаёт.
      - "${API_PORT:-8000}:8000"
    volumes:
      - storage:/srv/storage
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  storage:
