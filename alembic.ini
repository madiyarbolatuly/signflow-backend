[alembic]
script_location = migrations
prepend_sys_path = .
# Версии нумеруются по дате: в EDMS имена ревизий были случайными хешами,
# и порядок истории читался только через `alembic history`.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# URL здесь намеренно пуст: env.py берёт его из настроек приложения, чтобы
# строка подключения жила в одном месте.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
